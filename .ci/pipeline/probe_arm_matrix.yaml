---
job: ucx-probe-arm

failFast: false
timeout_minutes: 30

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 4Gi, cpu: 2000m}"
  requests: "{memory: 4Gi, cpu: 2000m}"

runs_on_dockers:
  - {
      name: "arm-plain",
      url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0",
      arch: aarch64
    }
  - {
      name: "arm-hostnet",
      url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0",
      arch: aarch64,
      hostNetwork: true
    }
  - {
      name: "arm-cx7",
      url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0",
      arch: aarch64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "sriov-cx7-p2" }],
      limits: "{memory: 4Gi, cpu: 2000m, nvidia.com/sriov_cx7_p2: 1}",
      requests: "{memory: 4Gi, cpu: 2000m, nvidia.com/sriov_cx7_p2: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]"
    }
  - {
      name: "arm-cx8",
      url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0",
      arch: aarch64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "cx8-ib-network" }],
      limits: "{memory: 4Gi, cpu: 2000m, nvidia.com/cx8_vfs: 1}",
      requests: "{memory: 4Gi, cpu: 2000m, nvidia.com/cx8_vfs: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]"
    }

taskName: '${name}/${arch}'

steps:
  - name: Probe RDMA
    parallel: false
    timeout: 10
    run: |
      set -x +e
      echo "NODE_NAME=${NODE_NAME} hostname=$(hostname) arch=$(uname -m)"
      lscpu | grep -i 'model name'
      ls -l /sys/class/infiniband /dev/infiniband
      ibv_devinfo
      lspci -nn | grep -i -e mellanox -e 15b3
      ip -br link
      ip -br addr
      cat /proc/net/dev | awk '{print $1}'
      exit 0
