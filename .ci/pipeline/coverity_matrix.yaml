---
job: ucx-coverity

failFast: false
timeout_minutes: 90

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 8Gi, cpu: 6000m}"
  requests: "{memory: 8Gi, cpu: 6000m}"

volumes:
  - {mountPath: /hpc/local, hostPath: /hpc/local}
  - {mountPath: /auto/sw_tools/Commercial, hostPath: /auto/sw_tools/Commercial}

runs_on_dockers:
  # Coverity 2026 needs glibc 2.18+.
  - { name: "cov", url: "harbor.mellanox.com/ucx/x86_64/rhel9.0/builder:mofed-5.6-0.5.0.0", arch: x86_64 }

matrix:
  axes:
    arch:
      - x86_64
    type:
      - release
      - devel

taskName: '${arch}/${name}/${type}'

env:
  # Set Azure built-ins expected by the script
  BUILD_ID: "${BUILD_NUMBER}"
  # Module name of the lab modulefiles tree.
  COV_MODULE: "tools/cov-2026.03"
  COV_AGGRESSIVENESS: "high"
  # Coverity 2026 ships no compiler configuration.
  COV_CONFIGURE: "yes"
  # common.sh builds and analyzes with 4 jobs unless set; match the pod CPUs.
  parallel_jobs: "6"

steps:
  - name: Coverity
    parallel: false
    # Coverity 2026 devel capture and analysis run past 30 minutes.
    timeout: 75
    run: |
      ./buildlib/tools/coverity.sh ${type} --clean --with-cuda --with-gdrcopy --with-java
