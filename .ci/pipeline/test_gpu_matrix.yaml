---
job: ucx-test-gpu

failFast: false
timeout_minutes: 420

registry_host: harbor.mellanox.com
registry_auth: ucx_harbor_credentials
registry_path: /ucx/ci

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 8Gi, cpu: 4000m}"
  requests: "{memory: 8Gi, cpu: 4000m}"
  privileged: true

credentials:
  - {credentialsId: 'svcnbu-swx-hpcx-scctl', usernameVariable: 'SERVICE_USER_USERNAME', passwordVariable: 'SERVICE_USER_PASSWORD'}
  - {credentialsId: 'ucx_harbor_credentials', usernameVariable: 'REPO_USER', passwordVariable: 'REPO_PASS'}


env:
  UCX_REPO: "https://github.com/openucx/ucx.git"
  RUN_TESTS: "yes"
  TEST_PERF: "1"
  VALGRIND_CHECK: "no"
  RUNNING_IN_AZURE: "no"
  GTEST_MAX_IB_SL: "4"
  nworkers: "4"
  SLURM_NODES: 1
  SLURM_PARTITION: funk
  SLURM_GRES: "gpu:1"
  SLURM_HEAD_NODE: scctl
  SLURM_JOB_TIMEOUT: '05:30:00'
  SLURM_IMMEDIATE_TIMEOUT: 3600
  SCCTL_CREDENTIALS_ID: 'svcnbu-swx-hpcx-scctl'
  JOB_ID_FILE_ROOT: "/mnt/pvc/${JOB_BASE_NAME}"
  TEST_TIMEOUT: 300
  # Fail on funk only (no IMEX channel, host PID ns, 64 CPUs).
  GTEST_FILTER: "*:-cuda_ipc/test_cuda_ipc_md.mkey_pack_mempool/*:cuda_ipc/test_uct_loopback_cuda.envelope/*:all/test_worker_cpu_mask.all_cpus/*"
  STORAGE_DRIVER: overlay
  CI_IMAGE_TAG: "20260223-1"

empty_volumes:
  - {mountPath: /var/lib/containers/storage, memory: false}

pvc_volumes:
  - {claimName: nbu-swx-ucx-pvc, mountPath: /mnt/pvc, readOnly: false}

runs_on_dockers:
  - {
     file: '.ci/dockerfiles/Dockerfile.build_helper',
     name: 'build_helper_ucx',
     tag: "${CI_IMAGE_TAG}",
     build_args: '--build-arg BASE_IMAGE=dockerhub.nvidia.com/ubuntu:24.04',
     DOCKER_IMAGE: "harbor.mellanox.com#hpcx/x86_64/ubuntu24.04/builder:doca-3.1.0-gpunetio",
     ASAN_CHECK: "no"
    }
  # AddressSanitizer row, same agent image as above.
  - {
     name: 'build_helper_ucx_asan',
     uri: 'x86_64/build_helper_ucx',
     tag: "${CI_IMAGE_TAG}",
     DOCKER_IMAGE: "harbor.mellanox.com#ucx/centos8-mofed23-cuda11_asan:1",
     ASAN_CHECK: "yes"
    }

matrix:
  axes:
    arch:
      - x86_64
    worker: [0, 1, 2, 3]

taskName: '${arch}/${name}/w${worker}'

steps:
  - name: Allocate Environment
    containerSelector: "{name: 'build_helper_ucx.*'}"
    parallel: false
    shell: action
    module: slurmCI
    run: allocation
    args:
      partition: "${SLURM_PARTITION}"
      headNode: "${SLURM_HEAD_NODE}"
      nodes: "${SLURM_NODES}"
      jobTimeout: "${SLURM_JOB_TIMEOUT}"
      immediateTimeout: "${SLURM_IMMEDIATE_TIMEOUT}"
      jobName: "ucx-ci-gpu-${BUILD_NUMBER}-${name}-w${worker}"
      # pipeline_stop matches job_id_*_${BUILD_NUMBER}.txt.
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${name}_w${worker}_${BUILD_NUMBER}.txt"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      # Without a GPU gres the node's GPU is hidden from the job.
      extraArgs: ["--gres=${SLURM_GRES}"]

  # Same container name as Test, so pyxis reuses the checkout.
  - name: Checkout
    containerSelector: "{name: 'build_helper_ucx.*'}"
    timeout: "${TEST_TIMEOUT}"
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${name}_w${worker}_${BUILD_NUMBER}.txt"
      testScript: "mkdir -p /ws && cd /ws && git clone ${UCX_REPO} . && git fetch --no-tags origin ${sha1} && git checkout ${sha1}"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${DOCKER_IMAGE}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "ucx-ci-gpu-${BUILD_NUMBER}-${name}-w${worker}"
      extraArgs: ["--container-mounts=/hpc/local:/hpc/local"]
      slurmEnv: ["NVIDIA_VISIBLE_DEVICES=all"]

  - name: Test
    containerSelector: "{name: 'build_helper_ucx.*'}"
    timeout: "${TEST_TIMEOUT}"
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${name}_w${worker}_${BUILD_NUMBER}.txt"
      testScript: "cd /ws && GTEST_FILTER=\"${GTEST_FILTER}\" ./contrib/test_jenkins.sh"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${DOCKER_IMAGE}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "ucx-ci-gpu-${BUILD_NUMBER}-${name}-w${worker}"
      extraArgs: ["--container-mounts=/hpc/local:/hpc/local"]
      slurmEnv: [
        "NVIDIA_VISIBLE_DEVICES=all",
        "GTEST_MAX_IB_SL=${GTEST_MAX_IB_SL}",
        "EXECUTOR_NUMBER=${worker}",
        "RUNNING_IN_AZURE=${RUNNING_IN_AZURE}",
        "sha1=${sha1}",
        "worker=${worker}",
        "nworkers=${nworkers}",
        "RUN_TESTS=${RUN_TESTS}",
        "TEST_PERF=${TEST_PERF}",
        "ASAN_CHECK=${ASAN_CHECK}",
        "VALGRIND_CHECK=${VALGRIND_CHECK}"
      ]

# Loads swx-jenkins-lib once before the parallel rows; /tmp has no job id files.
pipeline_start:
  containerSelector: "{name: 'build_helper_ucx'}"
  parallel: false
  shell: action
  module: slurmCI
  run: stopAllForBuild
  args:
    credentialsId: "${SCCTL_CREDENTIALS_ID}"
    headNode: "${SLURM_HEAD_NODE}"
    jobIdDir: "/tmp"

pipeline_stop:
  containerSelector: "{name: 'build_helper_ucx'}"
  parallel: false
  shell: action
  module: slurmCI
  run: stopAllForBuild
  args:
    credentialsId: "${SCCTL_CREDENTIALS_ID}"
    headNode: "${SLURM_HEAD_NODE}"
    jobIdDir: "${JOB_ID_FILE_ROOT}"
