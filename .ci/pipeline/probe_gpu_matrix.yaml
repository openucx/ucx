---
job: ucx-probe-gpu

failFast: false
timeout_minutes: 40

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 8Gi, cpu: 4000m}"
  requests: "{memory: 8Gi, cpu: 4000m}"

runs_on_dockers:
  - {
      name: "gpu",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      limits: "{memory: 8Gi, cpu: 4000m, nvidia.com/gpu: 1}",
      requests: "{memory: 8Gi, cpu: 4000m, nvidia.com/gpu: 1}"
    }
  - {
      name: "gpu-roce",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "sriov-cx7-p2" }],
      limits: "{memory: 8Gi, cpu: 4000m, nvidia.com/gpu: 1, nvidia.com/sriov_cx7_p2: 1}",
      requests: "{memory: 8Gi, cpu: 4000m, nvidia.com/gpu: 1, nvidia.com/sriov_cx7_p2: 1}"
    }

taskName: '${arch}/${name}'

steps:
  - name: Probe
    run: |
      echo "==== RESULT ${name} scheduled on $(hostname)"
      nvidia-smi -L 2>&1 || true
      ls /dev/infiniband 2>&1 || true
