---
job: ucx-test

failFast: false
timeout_minutes: 240

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 16Gi, cpu: 6000m}"
  requests: "{memory: 16Gi, cpu: 6000m}"

# RAM-backed /dev/shm for shm transports; counts toward pod memory.
empty_volumes:
  - {mountPath: /dev/shm, memory: true}

# MPI modules used by test_jenkins.sh.
volumes:
  - {mountPath: /hpc/local, hostPath: /hpc/local}

runs_on_dockers:
  # HCA RoCE (CX7)
  - {
      name: "hca-roce",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "sriov-cx7-p2" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      requests: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]"
    }
  # HCA IB (CX8)
  - {
      name: "hca-ib",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "cx8-ib-network" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/cx8_vfs: 1}",
      requests: "{memory: 32Gi, cpu: 10000m, nvidia.com/cx8_vfs: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]"
    }

  # AddressSanitizer on both fabrics
  - {
      name: "hca-roce-asan",
      url: "harbor.mellanox.com/ucx/x86_64/ubuntu22.04/builder:mofed-5.7-0.2.3.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "sriov-cx7-p2" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      requests: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]",
      ASAN_CHECK: "yes"
    }
  - {
      name: "hca-ib-asan",
      url: "harbor.mellanox.com/ucx/x86_64/ubuntu22.04/builder:mofed-5.7-0.2.3.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "cx8-ib-network" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/cx8_vfs: 1}",
      requests: "{memory: 32Gi, cpu: 10000m, nvidia.com/cx8_vfs: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]",
      ASAN_CHECK: "yes"
    }

matrix:
  axes:
    arch: [x86_64]
    worker: [0, 1, 2, 3]

taskName: '${name}/${arch}/w${worker}'

env:
  RUN_TESTS: "yes"
  TEST_PERF: "0"
  VALGRIND_CHECK: "no"
  nworkers: "4"
  STEP_TIMEOUT_MINUTES: "210"
  # Needs more contexts than the VF BAR allows.
  GTEST_FILTER: "*:-*test_uct_peer_failure_multiple*"

steps:
  - name: Test
    parallel: false
    timeout: "${STEP_TIMEOUT_MINUTES}"
    run: |
      # Limit tests to 2 CPUs to prevent max_threads exhaustion in k8s (similar to Azure CPU affinity)
      allowed_cpus=$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)
      first_chunk=${allowed_cpus%%,*}
      if [[ "${first_chunk}" == *-* ]]; then
        start_cpu=${first_chunk%-*}
        end_cpu=${first_chunk#*-}
        if [ "${end_cpu}" -gt "${start_cpu}" ]; then
          cpu_set="${start_cpu}-$((start_cpu + 1))"
        else
          cpu_set="${start_cpu}"
        fi
      else
        cpu_set="${first_chunk}"
      fi

      echo "Running test_jenkins.sh with CPU affinity: ${cpu_set} (allowed: ${allowed_cpus})"
      taskset -c "${cpu_set}" ./contrib/test_jenkins.sh
