---
job: ucx-test

failFast: false
timeout_minutes: 240

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 16Gi, cpu: 6000m}"
  requests: "{memory: 16Gi, cpu: 6000m}"

# RAM-backed /dev/shm for shm transports; counts toward pod memory.
empty_volumes:
  - {mountPath: /dev/shm, memory: true}

runs_on_dockers:
  - { name: "ubuntu2404-doca2.9", url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0", arch: x86_64 }
  # RoCE VF (CX7).
  # The requests are below the limits so that two PR runs fit the namespace quota.
  # The filter skips tests a VF cannot run: BAR too small, PCI link speed unknown.
  - {
      name: "hca-roce",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "sriov-cx7-p2" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      requests: "{memory: 10Gi, cpu: 3000m, nvidia.com/sriov_cx7_p2: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]",
      GTEST_FILTER: "*:-*test_uct_peer_failure_multiple*:*test_pci_bw.get_pci_bw*"
    }

matrix:
  axes:
    arch: [x86_64]
    worker: [0, 1, 2, 3]

taskName: '${arch}/${name}/w${axis_index}'

env:
  RUN_TESTS: "yes"
  TEST_PERF: "0"
  ASAN_CHECK: "no"
  VALGRIND_CHECK: "no"
  nworkers: "4"

steps:
  - name: Test
    parallel: false
    timeout: 360
    run: |
      ./contrib/test_jenkins.sh
