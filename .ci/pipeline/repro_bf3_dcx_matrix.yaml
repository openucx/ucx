---
job: ucx-bf3-dcx-repro

failFast: false
timeout_minutes: 210

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  # Job timeout plus 30 minutes: ends a pod that outlives its build
  activeDeadlineSeconds: 14400
  # Each ucx_perftest pins a send and a receive buffer of MemTotal/16, and
  # the concurrency cell runs two pairs of them
  limits: "{memory: 20Gi, cpu: 6000m}"
  requests: "{memory: 20Gi, cpu: 2000m}"
  tolerations: "[{key: 'hardware.node.kubernetes.io', operator: 'Equal', value: 'BF3', effect: 'NoSchedule'}]"
  # Verbs need privileged mode, RoCE GIDs need the DPU host netdevs.
  caps_add: "[ IPC_LOCK, NET_RAW ]"
  privileged: true
  hostNetwork: true

volumes:
  - {mountPath: /dev/infiniband, hostPath: /dev/infiniband}

# One pod on each BF3 host
runs_on_dockers:
  - {
      name: "bf3-01",
      url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0",
      arch: aarch64,
      nodeSelector: "kubernetes.io/hostname=yok-t-ipp-blossom-prod-bf3-01"
    }
  - {
      name: "bf3-02",
      url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0",
      arch: aarch64,
      nodeSelector: "kubernetes.io/hostname=yok-t-ipp-blossom-prod-bf3-02"
    }

matrix:
  axes:
    arch: [aarch64]

taskName: '${name}/${arch}'

steps:
  # A raw setup failure must not cost the host its UCX screen
  - name: Probe raw READ completion
    parallel: false
    timeout: 50
    run: |
      ulimit -c 0
      python3 .ci/scripts/bf3_dc_read_probe.py raw || echo "rc=$?" > bf3_raw_setup_failed

  - name: Build UCX
    parallel: false
    timeout: 45
    run: |
      ./autogen.sh
      ./configure --prefix=${WORKSPACE}/ucx-install --without-java --without-go --enable-mt
      make -s -j 6
      make -s install

  - name: Screen UCX DC settings
    parallel: false
    timeout: 90
    run: |
      ulimit -c 0
      python3 .ci/scripts/bf3_dc_read_probe.py screen ${WORKSPACE}/ucx-install
      test ! -e bf3_raw_setup_failed
