---
job: ucx-probe-push

failFast: false
timeout_minutes: 60

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 8Gi, cpu: 4000m}"
  requests: "{memory: 8Gi, cpu: 4000m}"
  privileged: true

credentials:
  - {credentialsId: 'svc-ucx-il-artifactory-token', usernameVariable: 'IL_USER', passwordVariable: 'IL_PASS'}

empty_volumes:
  - {mountPath: /var/lib/containers/storage, memory: false}

runs_on_dockers:
  - { name: "push", url: "harbor.mellanox.com/ucx/ci/x86_64/build_helper_ucx:20260223-1", arch: x86_64 }

taskName: '${arch}/${name}'

steps:
  - name: Push
    credentialsId: 'svc-ucx-il-artifactory-token'
    run: |
      set -e
      rm -f /etc/containers/storage.conf /usr/share/containers/storage.conf
      IL=il.artifactory.nvidia.com
      echo "IL user: ${IL_USER}"
      echo "${IL_PASS}" | podman login "${IL}" -u "${IL_USER}" --password-stdin
      copy() {
        podman pull -q "harbor.mellanox.com/$1/$2"
        podman tag "harbor.mellanox.com/$1/$2" "${IL}/sw-nbu-swx-$1-docker-local/$2"
        podman push -q "${IL}/sw-nbu-swx-$1-docker-local/$2" && echo "==== RESULT pushed $1/$2" || echo "==== RESULT push FAILED $1/$2"
      }
      copy ucx centos7:5
      copy hpcx x86_64/ubuntu24.04/builder:doca-2.9.0
