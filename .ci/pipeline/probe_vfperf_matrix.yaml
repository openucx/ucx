---
job: ucx-probe-vfperf

failFast: false
timeout_minutes: 120

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 16Gi, cpu: 6000m}"
  requests: "{memory: 16Gi, cpu: 6000m}"

empty_volumes:
  - {mountPath: /dev/shm, memory: true}

runs_on_dockers:
  # HCA RoCE (CX7)
  - {
      name: "hca-roce",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "sriov-cx7-p2" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      requests: "{memory: 32Gi, cpu: 10000m, nvidia.com/sriov_cx7_p2: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]"
    }
  # HCA IB (CX8)
  - {
      name: "hca-ib",
      url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0",
      arch: x86_64,
      tolerations: "[{key: 'node.kubernetes.io/unschedulable', operator: 'Exists', effect: 'NoSchedule'}]",
      annotations: [{ key: "k8s.v1.cni.cncf.io/networks", value: "cx8-ib-network" }],
      limits: "{memory: 32Gi, cpu: 10000m, nvidia.com/cx8_vfs: 1}",
      requests: "{memory: 32Gi, cpu: 10000m, nvidia.com/cx8_vfs: 1}",
      caps_add: "[ IPC_LOCK, NET_RAW ]"
    }

matrix:
  axes:
    arch: [x86_64]

taskName: '${name}/${arch}'

steps:
  - name: Probe
    parallel: false
    timeout: 110
    run: |
      cpubusy() {
        # Busy percent per CPU over 3 seconds, host-wide /proc/stat
        grep '^cpu[0-9]' /proc/stat > /tmp/s1; sleep 3; grep '^cpu[0-9]' /proc/stat > /tmp/s2
        paste /tmp/s1 /tmp/s2 | awk '{n=NF/2; t=0; i=0; for (k=2;k<=n;k++) {t+=$(k+n)-$k}; i=($(5+n)-$5)+($(6+n)-$6); printf "%s %d\n", $1, (t>0)?100*(t-i)/t:0}'
      }
      dev=$(ibv_devices | awk 'NR>2 {print $1; exit}')
      echo "==== dev=${dev} $(grep Cpus_allowed_list /proc/self/status) nproc=$(nproc)"
      echo "==== cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>&1) cpuset=$(cat /sys/fs/cgroup/cpuset.cpus.effective 2>&1) loadavg=$(cat /proc/loadavg)"
      cpubusy > /tmp/busy0; head -4 /tmp/busy0
      echo "==== host busy avg=$(awk '{s+=$2} END {print s/NR}' /tmp/busy0)"

      t0=$(date +%s)
      ./autogen.sh > /dev/null
      mkdir -p build-test && cd build-test
      ../contrib/configure-devel --prefix="${PWD}/install" --without-java \
          --enable-gtest --without-valgrind > /dev/null
      make -j10 -s > /dev/null 2>&1
      make -j10 -s -C test/gtest gtest > /dev/null 2>&1
      echo "==== build seconds (unpinned, -j10)=$(( $(date +%s) - t0 ))"

      cpubusy > /tmp/busy1
      echo "==== cpu0/cpu1 busy now: $(grep -E '^cpu[01] ' /tmp/busy1 | tr '\n' ' ') host avg=$(awk '{s+=$2} END {print s/NR}' /tmp/busy1)"
      idle2=$(sort -k2 -n /tmp/busy1 | head -2 | sed 's/cpu//; s/ .*//' | paste -sd, -)
      echo "==== least busy CPUs: ${idle2}"

      export UCX_HANDLE_ERRORS=bt
      filter='ud_verbs/test_uct_perf.*:rc_mlx5/test_uct_perf.*'
      for cs in 0-1 ${idle2}; do
        t1=$(date +%s)
        timeout 900 taskset -c ${cs} ./test/gtest/gtest --gtest_filter="${filter}" -p 1 -i 1.0 > /tmp/perf_${cs}.log 2>&1 && rc=0 || rc=$?
        echo "==== RESULT cpus=${cs} rc=${rc} seconds=$(( $(date +%s) - t1 ))"
        grep -E "RUN|OK \]|FAILED  \]|Invalid|latency :|rate :|bw :" /tmp/perf_${cs}.log | grep -v attempt | head -40
      done
      exit 0
