---
job: ucx-probe-registry

failFast: false
timeout_minutes: 30

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 2Gi, cpu: 1000m}"
  requests: "{memory: 2Gi, cpu: 1000m}"

runs_on_dockers:
  - { name: "harbor", url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0", arch: x86_64 }
  - { name: "artifactory-remote", url: "artifactory.nvidia.com/sw-nbu-cl-harbour-remote/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0", arch: x86_64 }
  - { name: "artifactory-remote-arm", url: "artifactory.nvidia.com/sw-nbu-cl-harbour-remote/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0", arch: aarch64 }

taskName: '${arch}/${name}'

steps:
  - name: Pull
    run: |
      echo "==== RESULT ${name} pulled OK"; head -2 /etc/os-release
