---
job: ucx-mpi-memhooks-repro
failFast: true
timeout_minutes: 30

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 10Gi, cpu: 6000m}"
  requests: "{memory: 10Gi, cpu: 6000m}"

volumes:
  - {mountPath: /hpc/local, hostPath: /hpc/local}

runs_on_dockers:
  - name: mpi
    url: harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0
    arch: x86_64

matrix:
  axes:
    arch: [x86_64]

taskName: '${name}/${arch}'

env:
  UCX_HANDLE_ERRORS: bt
  UCX_ERROR_SIGNALS: SIGILL,SIGSEGV,SIGBUS,SIGFPE,SIGPIPE

steps:
  - name: Verify MPI memory-hook cases
    parallel: false
    timeout: 25
    run: |
      set -euo pipefail
      ulimit -c 0
      test -w "${WORKSPACE}"
      export MPI_HOME=/hpc/local/benchmarks/daily/ga/2026-10-06/hpcx-gcc-ubuntu24.04/ompi5
      export OPAL_PREFIX="${MPI_HOME}"
      test -x "${MPI_HOME}/bin/mpirun"
      test -x "${MPI_HOME}/bin/mpicc"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${WORKSPACE}/install/lib:${MPI_HOME}/lib:"
      unset LD_PRELOAD UCX_MEM_MMAP_HOOK_MODE
      git rev-parse HEAD
      uname -a
      gcc --version | head -1
      mpi_version=$(mpirun --version)
      printf '%s\n' "${mpi_version}"
      [[ "${mpi_version}" == *"5.0.10rc2"* ]]
      mpicc --showme
      ./autogen.sh
      mkdir build-mpi-repro
      cd build-mpi-repro
      ../contrib/configure-release-mt --prefix="${WORKSPACE}/install" \
          --without-java --with-mpi --enable-assertions \
          LDFLAGS="-Wl,-rpath-link,${PWD}/src/ucs/.libs:${PWD}/src/ucm/.libs:${PWD}/src/uct/.libs:${PWD}/src/ucp/.libs"
      make -j6
      make install
      ldd ./test/mpi/test_memhooks
      export MPIRUN="timeout --foreground --signal=TERM --kill-after=5s 30s mpirun --allow-run-as-root --bind-to none -x UCX_ERROR_SIGNALS -x UCX_HANDLE_ERRORS -mca pml ob1 -mca osc ^ucx -mca btl tcp,self -mca btl_tcp_if_include lo -mca orte_allowed_exit_without_sync 1 -mca coll ^hcoll,ml,ucc"
      function_definition=$(sed -n '/^test_malloc_hooks_mpi() {$/,/^}$/p' ../contrib/test_jenkins.sh)
      status=0
      output=$(bash -euc "${function_definition}"$'\n''test_malloc_hooks_mpi' 2>&1) || status=$?
      printf '%s\n' "${output}"
      echo "MPI memory-hook matrix exit status ${status}"
      test "${status}" -eq 0
      test "$(grep -c ': initialized$' <<< "${output}")" -eq 10
      test "$(grep -c ': PASS$' <<< "${output}")" -eq 10
