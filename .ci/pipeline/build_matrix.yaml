---
job: ucx-build

failFast: false
timeout_minutes: 240

kubernetes:
  cloud: il-ipp-blossom-prod-nbu-swx-ucx
  namespace: nbu-swx-ucx
  limits: "{memory: 16Gi, cpu: 8000m}"
  requests: "{memory: 16Gi, cpu: 8000m}"

# Compiler, CUDA, fuse and doxygen modules used by builds.sh.
volumes:
  - {mountPath: /hpc/local, hostPath: /hpc/local}

runs_on_dockers:
  # x86_64
  - { name: "ubuntu2204-mofed5.7", url: "harbor.mellanox.com/ucx/x86_64/ubuntu22.04/builder:mofed-5.7-0.2.3.0", arch: x86_64, build_mode: short }
  - { name: "ubuntu2404-doca2.9", url: "harbor.mellanox.com/hpcx/x86_64/ubuntu24.04/builder:doca-2.9.0", arch: x86_64, build_mode: long }
  - { name: "ubuntu2604-mofed26.04", url: "harbor.mellanox.com/hpcx/x86_64/ubuntu26.04/builder:mofed-26.04-0.7.6.0", arch: x86_64, build_mode: short }
  - { name: "ubuntu2610-inbox", url: "harbor.mellanox.com/hpcx/x86_64/ubuntu26.10/builder:inbox", arch: x86_64, build_mode: sanity }
  - { name: "rocky89-mofed24.10", url: "harbor.mellanox.com/hpcx/x86_64/rocky8.9/builder:mofed-24.10-3.2.5.0", arch: x86_64, build_mode: sanity }
  - { name: "rocky96-mofed24.10", url: "harbor.mellanox.com/hpcx/x86_64/rocky9.6/builder:mofed-24.10-3.2.5.0", arch: x86_64, build_mode: sanity }
  - { name: "debian125-doca2.9", url: "harbor.mellanox.com/hpcx/x86_64/debian12.5/builder:doca-2.9.0", arch: x86_64, build_mode: short }
  - { name: "debian113-mofed5.8", url: "harbor.mellanox.com/hpcx/x86_64/debian11.3/builder:mofed-5.8-3.0.7.0", arch: x86_64, build_mode: sanity }
  - { name: "debian130-doca3.2", url: "harbor.mellanox.com/hpcx/x86_64/debian13.0/builder:doca-3.2.0", arch: x86_64, build_mode: short }
  - { name: "centos10stream-inbox", url: "harbor.mellanox.com/hpcx/x86_64/centos10stream/builder:inbox", arch: x86_64, build_mode: sanity }
  - { name: "fedora44-inbox", url: "harbor.mellanox.com/hpcx/x86_64/fedora44/builder:inbox", arch: x86_64, build_mode: sanity }
  # Azure Linux 4.0 is in public preview; the image tracks the azurelinux-beta channel.
  - { name: "azurelinux40-inbox", url: "harbor.mellanox.com/hpcx/x86_64/azurelinux4.0/builder:inbox", arch: x86_64, build_mode: sanity }
  - { name: "rhel82-mofed5.0", url: "harbor.mellanox.com/ucx/x86_64/rhel8.2/builder:mofed-5.0-1.0.0.0", arch: x86_64, build_mode: short }
  - { name: "rhel82-mofed5.0-gcc15.2", url: "harbor.mellanox.com/ucx/x86_64/rhel8.2/builder:mofed-5.0-1.0.0.0", arch: x86_64, build_mode: sanity, GCC_MODULE: "dev/gcc-15.2.0" }
  - { name: "rhel90-mofed5.6", url: "harbor.mellanox.com/ucx/x86_64/rhel9.0/builder:mofed-5.6-0.5.0.0", arch: x86_64, build_mode: short }
  - { name: "rhel100-mofed25.07", url: "harbor.mellanox.com/hpcx/x86_64/rhel10.0/builder:mofed-25.07-0.9.7.0", arch: x86_64, build_mode: long }
  - { name: "sles15sp7-mofed26.01", url: "harbor.mellanox.com/hpcx/x86_64/sles15sp7/builder:mofed-26.01-0.8.8.0", arch: x86_64, build_mode: short }
  - { name: "sles16sp0-mofed26.01", url: "harbor.mellanox.com/hpcx/x86_64/sles16sp0/builder:mofed-26.01-0.8.0.0", arch: x86_64, build_mode: short }
  - { name: "openeuler2203sp4-doca3.5", url: "harbor.mellanox.com/hpcx/x86_64/openeuler22.03sp4/builder:doca-3.5.0", arch: x86_64, build_mode: short }
  - { name: "openeuler2403sp3-doca3.5", url: "harbor.mellanox.com/hpcx/x86_64/openeuler24.03sp3/builder:doca-3.5.0", arch: x86_64, build_mode: short }
  - { name: "ctyunos2507-mofed26.01", url: "harbor.mellanox.com/hpcx/x86_64/ctyunos25.07/builder:mofed-26.01-0.8.0.0", arch: x86_64, build_mode: short }
  - { name: "tencentos44-mofed26.04", url: "harbor.mellanox.com/hpcx/x86_64/tencentos4.4/builder:mofed-26.04-0.7.6.0", arch: x86_64, build_mode: short }
  # 20.1060a is the newest UOS rootfs on urm; DOCA publishes it for x86_64 only.
  - { name: "uos201060a-doca3.4", url: "harbor.mellanox.com/hpcx/x86_64/uos20.1060a/builder:doca-3.4.0", arch: x86_64, build_mode: short }
  - { name: "ubuntu2204-rocm6.0", url: "harbor.mellanox.com/ucx/x86_64/ubuntu2204:rocm-6.0.0", arch: x86_64, build_mode: short, CONTAINER: "ubuntu2204_rocm" }
  - { name: "centos7-ib", url: "harbor.mellanox.com/ucx/centos7:5", arch: x86_64, build_mode: sanity }
  # Intel oneAPI compiler with the Level Zero null driver; no Intel GPU needed.
  - { name: "ubuntu2404-ze", url: "harbor.mellanox.com/ucx/x86_64/ubuntu24.04/builder:ze-oneapi-2026.0.0-l0-1.27.0", arch: x86_64, build_mode: ze, require_ze: "yes" }
  # ICC and PGI come from /hpc/local modules.
  - { name: "centos7-icc-pgi", url: "harbor.mellanox.com/ucx/centos7:4", arch: x86_64, build_mode: compilers }
  # aarch64
  - { name: "ubuntu2404-doca2.9", url: "harbor.mellanox.com/hpcx/aarch64/ubuntu24.04/builder:doca-2.9.0", arch: aarch64, build_mode: long }
  - { name: "ubuntu2604-mofed26.04", url: "harbor.mellanox.com/hpcx/aarch64/ubuntu26.04/builder:mofed-26.04-0.7.6.0", arch: aarch64, build_mode: short }
  - { name: "ubuntu2610-inbox", url: "harbor.mellanox.com/hpcx/aarch64/ubuntu26.10/builder:inbox", arch: aarch64, build_mode: short }
  - { name: "fedora44-inbox", url: "harbor.mellanox.com/hpcx/aarch64/fedora44/builder:inbox", arch: aarch64, build_mode: short }
  - { name: "azurelinux40-inbox", url: "harbor.mellanox.com/hpcx/aarch64/azurelinux4.0/builder:inbox", arch: aarch64, build_mode: short }
  # DOCA publishes no aarch64 openEuler, so these take the MOFED route.
  - { name: "openeuler2203sp4-mofed26.07", url: "harbor.mellanox.com/hpcx/aarch64/openeuler22.03sp4/builder:mofed-26.07-0.7.7.0", arch: aarch64, build_mode: short }
  - { name: "openeuler2403sp3-mofed26.07", url: "harbor.mellanox.com/hpcx/aarch64/openeuler24.03sp3/builder:mofed-26.07-0.7.7.0", arch: aarch64, build_mode: short }
  # No DOCA or MOFED for UOS 20.1060a on aarch64, so inbox (rdma-core 37).
  - { name: "uos201060a-inbox", url: "harbor.mellanox.com/hpcx/aarch64/uos20.1060a/builder:inbox", arch: aarch64, build_mode: short }
  - { name: "rocky89-mofed24.10", url: "harbor.mellanox.com/hpcx/aarch64/rocky8.9/builder:mofed-24.10-3.2.5.0", arch: aarch64, build_mode: short }
  - { name: "rocky96-mofed24.10", url: "harbor.mellanox.com/hpcx/aarch64/rocky9.6/builder:mofed-24.10-3.2.5.0", arch: aarch64, build_mode: short }
  - { name: "rhel100-mofed25.07", url: "harbor.mellanox.com/hpcx/aarch64/rhel10.0/builder:mofed-25.07-0.9.7.0", arch: aarch64, build_mode: short }
  - { name: "sles15sp7-mofed26.01", url: "harbor.mellanox.com/hpcx/aarch64/sles15sp7/builder:mofed-26.01-0.8.8.0", arch: aarch64, build_mode: short }
  - { name: "ctyunos2507-mofed26.01", url: "harbor.mellanox.com/hpcx/aarch64/ctyunos25.07/builder:mofed-26.01-0.8.0.0", arch: aarch64, build_mode: short }
  - { name: "tencentos44-mofed26.04", url: "harbor.mellanox.com/hpcx/aarch64/tencentos4.4/builder:mofed-26.04-0.7.6.0", arch: aarch64, build_mode: short }
  - { name: "sles16sp0-mofed26.01", url: "harbor.mellanox.com/hpcx/aarch64/sles16sp0/builder:mofed-26.01-0.8.0.0", arch: aarch64, build_mode: short }

taskName: '${arch}/${name}'

env:
  BUILD_ID: "${BUILD_NUMBER}"

steps:
  - name: Build
    parallel: false
    timeout: 180
    run: |
      # Workspace UID differs from container UID; trust it for git.
      git config --global --add safe.directory '*'
      ./buildlib/tools/builds.sh
