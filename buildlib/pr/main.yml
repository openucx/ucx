stages:
  - stage: Codestyle
    jobs:
    - template: codestyle.yml

  - stage: Basic_compile
    dependsOn: []
    jobs:
    - template: basic_compile.yml

  - stage: Static_check
    dependsOn: [Basic_compile]
    jobs:
    - template: static_checks.yml

  - stage: ucx_perftest_mad_rte
    dependsOn: [Basic_compile]
    displayName: ucx_perftest over MAD RTE
    lockBehavior: sequential
    variables:
      - group: concurrency_lock
    jobs:
    - template: mad_tests.yml

  - stage: WireCompat
    dependsOn: [Basic_compile]
    jobs:
    - template: wire_compat.yml
      parameters:
        name: althca
        demands: ucx_althca -equals yes
    - template: wire_compat.yml
      parameters:
        name: gpu
        demands: ucx_gpu -equals yes
        container: centos7_cuda11
        ucx_targets:
          ucx_1_15:
            ucx_tag: v1.15.x
          ucx_1_16:
            ucx_tag: v1.16.x
          ucx_1_17:
            ucx_tag: v1.17.x
          ucx_1_18:
            ucx_tag: v1.18.x
    - template: wire_compat.yml
      parameters:
        name: new
        demands: ucx_new -equals yes
    # Temporarily disable wire-compat tests on rain machines
    #- template: wire_compat.yml
    #  parameters:
    #    name: bond
    #    demands: ucx_iodemo -equals yes

  - stage: Coverity
    dependsOn: [Static_check]
    jobs:
      - template: coverity.yml
        parameters:
          demands: ucx_docker -equals yes
          container: coverity_rh7

  - stage: Tests
    dependsOn: [Basic_compile]
    jobs:
    - template: tests.yml
      parameters:
        name: althca
        demands: ucx_althca -equals yes
        test_perf: 0
    - template: tests.yml
      parameters:
        name: gpu
        demands: ucx_gpu -equals yes
        test_perf: 1
        container: ubuntu2404_doca31_gpunetio
        prebuild: yes
    - template: tests.yml
      parameters:
        name: new
        demands: ucx_new -equals yes
        test_perf: 1
    - template: tests.yml
      parameters:
        name: roce
        demands: ucx_roce -equals yes
        test_perf: 0
    - template: tests.yml
      parameters:
        name: BlueField
        demands: ucx_bf -equals yes
        run_tests: yes
        test_perf: 0

  - stage: EFA_Tests
    dependsOn: [Basic_compile]
    jobs:
    - template: efa.yml
      parameters:
        name: EFA
        demands: ucx_new -equals yes

  - stage: Namespace_Tests
    dependsOn: [Basic_compile]
    jobs:
    - template: namespace_tests.yml
      parameters:
        name: new_namespace
        demands: ucx_new -equals yes
    - template: namespace_tests.yml
      parameters:
        name: gpu_namespace
        demands: ucx_gpu -equals yes

  - stage: io_demo
    dependsOn: [Basic_compile]
    condition: false
    jobs:
    - template: io_demo/io-demo.yml

  - stage: jucx
    dependsOn: [Basic_compile]
    jobs:
      - template: ../jucx/jucx-test.yml
        parameters:
          arch: amd64
          name: gpu
          demands: ucx_gpu

      - template: ../jucx/jucx-test.yml
        parameters:
          arch: aarch64
          demands: ucx-arm64

  - stage: go
    dependsOn: [Basic_compile]
    jobs:
      - template: go/go-test.yml
        parameters:
          name: new
          demands: ucx_new -equals yes
      - template: go/go-test.yml
        parameters:
            name: gpu
            demands: ucx_gpu -equals yes

  - stage: Build_Static
    dependsOn: [Basic_compile]
    jobs:
      - job: build_source
        pool:
          name: MLNX
          demands:
            - ucx_docker -equals yes
        workspace:
          clean: all
        strategy:
          matrix:
            centos7:
              CONTAINER: centos7_ib
              extra_modules: ucx-ib ucx-cma ucx-rdmacm ucx-ib-mlx5
              extra_tls: dc_mlx5 rc_mlx5 ud_mlx5 rc_verbs ud_verbs cma
              run_tls: ib rc rc_v rc_x dc dc_x ud ud_v ud_x shm sm
            ubuntu2204:
              CONTAINER: ubuntu2204
              extra_modules: ""
              extra_tls: ""
              run_tls: ""
            ubuntu2404:
              CONTAINER: ubuntu2404
              extra_modules: ""
              extra_tls: ""
              run_tls: ""
        container: $[ variables['CONTAINER'] ]
        timeoutInMinutes: 340

        steps:
          - checkout: self
            clean: true
            fetchDepth: 100
            retryCountOnTaskFailure: 5

          - bash: |
              ./buildlib/tools/build_static.sh
            displayName: Build
            env:
              EXTRA_TLS: $(extra_tls)
              RUN_TLS: $(run_tls)
              EXTRA_MODULES: $(extra_modules)
              EXECUTOR_NUMBER: $(AZP_AGENT_ID)


  - stage: Cuda
    dependsOn: [Basic_compile]
    jobs:
      - template: cuda/cuda.yml
      - job: soname_suffix_cuda_ib
        displayName: SONAME suffix and deepbind on CUDA/IB
        pool:
          name: MLNX
          demands:
            - ucx_gpu_test -equals yes
        container: ubuntu2404_doca31_gpunetio
        workspace:
          clean: all
        timeoutInMinutes: 120

        steps:
          - checkout: self
            clean: true
            fetchDepth: 100
            retryCountOnTaskFailure: 5

          - bash: |
              ./buildlib/tools/builds.sh
            displayName: Build SONAME suffix with CUDA/IB
            env:
              BUILD_ID: "$(Build.BuildId)-$(Build.BuildNumber)"
              build_mode: soname_suffix
              soname_suffix_check_hw: yes
              ucx_gpu: yes
              EXECUTOR_NUMBER: $(AZP_AGENT_ID)


  - stage: AddressSanitizer
    dependsOn: [Static_check]
    jobs:
    - template: tests.yml
      parameters:
        name: gpu
        demands: ucx_gpu -equals yes
        test_perf: 0
        container: centos8_cuda11_asan
        asan_check: yes
        prebuild: yes
    - template: tests.yml
      parameters:
        name: new
        demands: ucx_new -equals yes
        test_perf: 0
        container: ubuntu2204_ib
        asan_check: yes
    - template: tests.yml
      parameters:
        name: roce
        demands: ucx_roce -equals yes
        test_perf: 0
        container: ubuntu2204_ib
        asan_check: yes
    - template: tests.yml
      parameters:
        name: BlueField
        demands: ucx_bf -equals yes
        test_perf: 0
        asan_check: yes


