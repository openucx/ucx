parameters:
  # Each image builds UCX on a build agent, then runs the memory hooks test with
  # that build tree on a GPU agent
  images:
    centos7_cuda_11_0: nvidia/cuda:11.0.3-devel-centos7
    centos7_cuda_11_1: nvidia/cuda:11.1.1-devel-centos7
    centos7_cuda_11_2: nvidia/cuda:11.2.2-devel-centos7
    centos7_cuda_11_3: nvidia/cuda:11.3.1-devel-centos7
    centos7_cuda_11_4: nvidia/cuda:11.4.3-devel-centos7
    ubi8_cuda_11_5: nvidia/cuda:11.5.2-devel-ubi8
    ubi8_cuda_11_6: nvidia/cuda:11.6.2-devel-ubi8
    ubuntu18_cuda_11_0: nvidia/cuda:11.0.3-devel-ubuntu18.04
    ubuntu18_cuda_11_1: nvidia/cuda:11.1.1-devel-ubuntu18.04
    ubuntu18_cuda_11_2: nvidia/cuda:11.2.2-devel-ubuntu18.04
    ubuntu18_cuda_11_3: nvidia/cuda:11.3.1-devel-ubuntu18.04
    ubuntu18_cuda_11_4: nvidia/cuda:11.4.3-devel-ubuntu18.04
    ubuntu18_cuda_11_5: nvidia/cuda:11.5.2-devel-ubuntu18.04
    ubuntu18_cuda_11_6: nvidia/cuda:11.6.2-devel-ubuntu18.04
    ubuntu20_cuda_11_0: nvidia/cuda:11.0.3-devel-ubuntu20.04
    ubuntu20_cuda_11_1: nvidia/cuda:11.1.1-devel-ubuntu20.04
    ubuntu20_cuda_11_2: nvidia/cuda:11.2.2-devel-ubuntu20.04
    ubuntu20_cuda_11_3: nvidia/cuda:11.3.1-devel-ubuntu20.04
    ubuntu20_cuda_11_4: nvidia/cuda:11.4.3-devel-ubuntu20.04
    ubuntu20_cuda_11_5: nvidia/cuda:11.5.2-devel-ubuntu20.04
    ubuntu20_cuda_11_6: nvidia/cuda:11.6.2-devel-ubuntu20.04
    centos7_cuda_12_0: nvidia/cuda:12.0.0-devel-centos7
    centos7_cuda_12_1: nvidia/cuda:12.1.0-devel-centos7
    ubuntu18_cuda_12_0: nvidia/cuda:12.0.0-devel-ubuntu18.04
    ubuntu18_cuda_12_1: nvidia/cuda:12.1.0-devel-ubuntu18.04
    ubuntu20_cuda_12_0: nvidia/cuda:12.0.0-devel-ubuntu20.04
    ubuntu20_cuda_12_1: nvidia/cuda:12.1.0-devel-ubuntu20.04
    ubuntu22_cuda_12_0: nvidia/cuda:12.0.0-devel-ubuntu22.04
    ubuntu22_cuda_12_1: nvidia/cuda:12.1.0-devel-ubuntu22.04
    ubuntu22_cuda_13_0: nvidia/cuda:13.0.0-devel-ubuntu22.04
    ubuntu24_cuda_13_0: nvidia/cuda:13.0.0-devel-ubuntu24.04
    rocky8_cuda_13_0: nvidia/cuda:13.0.0-devel-rockylinux8
    rocky9_cuda_13_0: nvidia/cuda:13.0.0-devel-rockylinux9

jobs:
  - job: source_tarball
    displayName: Create UCX source tarball
    workspace:
      clean: all
    pool:
      name: MLNX
      demands:
        - ucx_docker -equals yes
    container: centos7

    steps:
      - checkout: self
        clean: true
        fetchDepth: 100
        retryCountOnTaskFailure: 5
      - bash: |
          set -eEx
          ./autogen.sh
          tar -cf $(Build.ArtifactStagingDirectory)/ucx_src.tar --exclude=./.git .
        displayName: Autogen ucx
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/ucx_src.tar
          artifact: ucx_src_cuda

  # The build tree holds absolute paths, so the test uses it at the path where
  # it was built. $(Agent.TempDirectory) is /__w/_temp in the container on every
  # agent, unlike the pipeline workspace /__w/<N>.
  - ${{ each image in parameters.images }}:
    - job: build_${{ image.key }}
      dependsOn: source_tarball
      displayName: Build Cuda Docker ${{ image.key }}
      workspace:
        clean: all
      pool:
        name: MLNX
        demands:
          - ucx_docker -equals yes
      container:
        image: ${{ image.value }}
        options: $(DOCKER_OPT_ARGS)
      timeoutInMinutes: 60
      variables:
        workspace: $(Agent.TempDirectory)/ucx
      steps:
        - checkout: none
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: ucx_src_cuda
            path: $(Pipeline.Workspace)/ucx_src
        - bash: |
            set -xeE
            rm -rf $(workspace)
            mkdir -p $(workspace)
            tar -xf $(Pipeline.Workspace)/ucx_src/ucx_src.tar -C $(workspace)
            $(workspace)/buildlib/pr/cuda/test_malloc_hook.sh build
            tar -cf $(Build.ArtifactStagingDirectory)/ucx_build.tar -C $(workspace) .
          displayName: Build
          env:
            WORKSPACE: $(workspace)
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: $(Build.ArtifactStagingDirectory)/ucx_build.tar
            artifact: ucx_build_${{ image.key }}

    - job: test_${{ image.key }}
      dependsOn: build_${{ image.key }}
      displayName: Test Cuda Docker ${{ image.key }}
      workspace:
        clean: all
      pool:
        name: MLNX
        demands:
          - ucx_gpu_test -equals yes
      container:
        image: ${{ image.value }}
        options: $(DOCKER_OPT_ARGS) $(DOCKER_OPT_GPU)
      timeoutInMinutes: 60
      variables:
        workspace: $(Agent.TempDirectory)/ucx
      steps:
        - checkout: none
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: ucx_build_${{ image.key }}
            path: $(Pipeline.Workspace)/ucx_build
        - bash: |
            set -xeE
            rm -rf $(workspace)
            mkdir -p $(workspace)
            tar -xf $(Pipeline.Workspace)/ucx_build/ucx_build.tar -C $(workspace)
            $(workspace)/buildlib/pr/cuda/test_malloc_hook.sh test
          displayName: Memory hooks test
          env:
            WORKSPACE: $(workspace)
