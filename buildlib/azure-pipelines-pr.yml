# See https://aka.ms/yaml
# This pipeline to be run on PRs

trigger: none
pr:
  drafts: false
  branches:
    include:
    - master
    - v*.*.x
  paths:
    exclude:
    - .agents
    - .ci
    - .claude/skills
    - .gitignore
    - .readthedocs.yaml
    - AGENTS.md
    - "**/AGENTS.md"
    - CLAUDE.md
    - contrib/pr_merge_check.py
    - contrib/check_qps.sh
    - docs/source
    - docs/CodeStyle.md
    - docs/LoggingStyle.md
    - docs/OptimizationStyle.md
    - README.md
    - REVIEW.md
    - NEWS
    - AUTHORS
    - buildlib/azure-pipelines-perf.yml
    - buildlib/tools/perf_results.py
    - buildlib/tools/perf-common.yml

resources:
  repositories:
    - repository: ucxx
      type: github
      name: rapidsai/ucxx
      endpoint: Mellanox-lab
      # rapids_cuda_version of the UCXX slices in pr/main.yml follows the CUDA
      # versions this ucxx commit builds with (matrix in its dependencies.yaml).
      # Keep in sync with the ucxx ref in azure-pipelines-release.yml, so the
      # release pipeline builds the UCXX tree this pipeline validates.
      ref: 7d0234f3131794bd37cf509ab3bde2026ae7eb78

extends:
  template: pr/main.yml
