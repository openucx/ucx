# See https://aka.ms/yaml
# This pipeline to be run on PRs

trigger: none
pr:
  drafts: false
  branches:
    include:
    - master
    - v*.*.x
  paths:
    exclude:
    - .agents
    - .ci
    - .claude/skills
    - .gitignore
    - .readthedocs.yaml
    - AGENTS.md
    - "**/AGENTS.md"
    - CLAUDE.md
    - contrib/pr_merge_check.py
    - contrib/check_qps.sh
    - docs/source
    - docs/CodeStyle.md
    - docs/LoggingStyle.md
    - docs/OptimizationStyle.md
    - README.md
    - REVIEW.md
    - NEWS
    - AUTHORS
    - buildlib/azure-pipelines-perf.yml
    - buildlib/tools/perf_results.py
    - buildlib/tools/perf-common.yml

# TEMPORARY: validate only the allocation regression fixed by PR #12211.
stages:
  - stage: jucx
    jobs:
      - template: jucx/jucx-test.yml
        parameters:
          arch: amd64
          demands: ucx_gpu

      - template: jucx/jucx-test.yml
        parameters:
          arch: aarch64
          demands: ucx-arm64
