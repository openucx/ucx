parameters:
  arch:
  name: java test
  demands: []

jobs:
  - job: jucx_test_${{ parameters.arch }}
    displayName: JUCX Test ${{ parameters.arch }}
    workspace:
      clean: all

    pool:
      name: MLNX
      demands: ${{ parameters.demands }}

    strategy:
      matrix:
        java8:
          JAVA_VERSION: 1.8
        java11:
          JAVA_VERSION: 1.11

    steps:
      - checkout: self
        clean: true
        retryCountOnTaskFailure: 5
        displayName: Checkout
      - bash: |
          set -xeE
          source buildlib/az-helpers.sh
          check_gpu ${{ parameters.name }}
          az_init_modules
          az_module_load dev/mvn
          az_module_load dev/jdk-${JAVA_VERSION}
          load_cuda_env
          ./autogen.sh
          ./contrib/configure-devel --prefix=$(Build.Repository.LocalPath)/install \
            --with-java --enable-gtest=no --with-cuda=$have_cuda
          make -j`nproc`
          make install
        displayName: Build UCX

      - bash: |
          set -xeE
          source buildlib/az-helpers.sh
          az_init_modules
          load_cuda_env
          az_module_load dev/mvn
          az_module_load dev/jdk-${JAVA_VERSION}

          make -C bindings/java/src/main/native test \
            MVN="mvn -Dtest=UcpMemoryTest#testMmapFile -DfailIfNoTests=true"
        displayName: Run UcpMemoryTest.testMmapFile
